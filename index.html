<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"
        integrity="sha512-u3fPA7V8qQmhBPNT5quvaXVa1mnnLSXUep5PS1qo5NRzHwG19aHmNJnj1Q8hpA/nBWZtZD4r4AX6YOt5ynLN2g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>


</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Ledger&display=swap"
    rel="stylesheet">

<body>
    <div class="container">
        <!--heather-->
        <header>
            <div class="settings">
                <a href="#" class="settings">Settings</a>
            </div>
            <div class="city">
                <a href="" class="city">Paris</a>
            </div>
        </header>

        <main>



            <div class="currentWeather">
                <div class="date">Friday 20 Januaty</div>
                <div class="weather">Sunny</div>
                <div class="temperature">31°</div>
            </div>

            <div class="dailySummary">
                <div class="title">dailySummary</div>
                <div class="descriptions">Now it feels +35° , actually +31°. <br />It feels hot becuse of the direct
                    sun. Today, the temperature is felt in the range from +31° to +27°.</div>
            </div>

            <div class="currentForecast">
                <div class="Wind"><i class="fas fa-wind"></i>
                    <div class="value">4km/h</div>
                    <div class="label">Wind</div>
                </div>
                <div class="humidity">
                    <div class="humidity"><i class="fas fa-wind"></i>
                        <div class="value">4km/h</div>
                        <div class="label">Wind</div>

                    </div>
                </div>

                <div class="weeklyForecast">
                    <div class="title">weeklyForecast</div> <i class="fa light fa-arrow-right long"></i>
                    <div class="week">
                        <div class="dayTemperature">26°</div>
                        <div class="dayWeather"><i class="fas fa-sun"></i></div>
                        <div class="date">21 Jan</div>
                    </div>
                    <div class="day">
                        <div class="dayTemperature">29°</div>
                        <div class="dayWeather"><i class="fas fa-cloud"></i></div>
                        <div class="date">22 Jan</div>
                    </div>
                    <div class="day">
                        <div class="dayTemperature">27°</div>
                        <div class="dayWeather"><i class="fas fa-cloud-rain"></i></div>
                        <div class="date">23 Jan</div>
                    </div>
                    <div class="day">
                        <div class="dayTemperature">27°</div>
                        <div class="dayWeather"><i class="fas fa-cloud-rain"></i></div>
                        <div class="date">24 Jan</div>
                    </div>



                </div>

        </main>



        <script src="script.js"></script>

</body>

</html>
